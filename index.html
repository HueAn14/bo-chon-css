<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Bộ chọn CSS</title>
    <!-- Kết nối tệp CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề (Sử dụng ID Selector để căn giữa) -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả (Sử dụng Class Selector) -->
    <p class="description">
        Xin chào! Tôi là một học viên lập trình web. Hiện tại tôi đang thực hành cách sử dụng các bộ chọn trong CSS để trang trí giao diện.
    </p>

    <!-- Danh sách sở thích (Sử dụng Element & Class Selectors) -->
    <ul class="hobby-list">
        <li class="hobby-item item-1">Đọc sách công nghệ</li>
        <li class="hobby-item item-2">Viết code và làm dự án</li>
        <li class="hobby-item item-3">Lắng nghe âm nhạc</li>
    </ul>

    <!-- Nút bấm (Sử dụng Pseudo-class :hover) -->
    <button class="btn-action">Nhấn vào đây</button>

</body>
</html>
